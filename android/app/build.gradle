plugins { id 'com.android.application' }

android {
    namespace 'com.smashwinny.anubis'
    compileSdk 34

    defaultConfig {
        applicationId 'com.smashwinny.anubis'
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName '0.5.1'
    }

    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/anubis-assets')
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core:1.13.1'
}

tasks.register('syncWebAssets', Copy) {
    from('../..')
    include 'index.html', 'styles.css', 'sync.css', 'app.js', 'sync.js', 'manifest.webmanifest', 'icon.svg', 'vendor/qrcode.js'
    into layout.buildDirectory.dir('generated/anubis-assets')
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
